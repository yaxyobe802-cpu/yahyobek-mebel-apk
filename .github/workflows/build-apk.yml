name: Build Yahyobek Mebel AI APK

on:
workflow_dispatch:
push:
paths:
- '*.zip'
- '.github/workflows/build-apk.yml'

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Download project
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android
    uses: android-actions/setup-android@v3

  - name: Install Android SDK
    run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

  - name: Extract project ZIP
    run: |
      mkdir extracted
      ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
      test -n "$ZIP_FILE"
      unzip -q "$ZIP_FILE" -d extracted
      PROJECT_DIR=$(find extracted -name settings.gradle -type f | head -n 1 | xargs dirname)
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build APK
    run: gradle --no-daemon assembleDebug
    working-directory: ${{ env.PROJECT_DIR }}

  - name: Save APK
    uses: actions/upload-artifact@v4
    with:
      name: Yahyobek-Mebel-AI-APK
      path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
